[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxigraph-spike"
version = "0.1.0"
description = "TaxiGraph bounded feasibility spike: synthetic smoke harness and gated real-data GTFS/OTP evaluation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
